name: Import original drink photography
on: push
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify photo package
        run: |
          curl --fail --location --retry 2 -H "Referer: https://qu.ax/tdT6w" -o /tmp/solo-drive-photos.zip https://qu.ax/x/tdT6w.zip
          echo "4bb2b07f11b29cfaeb498d008e125112d4ec2caeb80a18d4402c1cc1b44758f3  /tmp/solo-drive-photos.zip" | sha256sum --check
      - name: Validate and unpack photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('/tmp/solo-drive-photos.zip')
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name == 'photos.sha256' or (name.startswith('assets/menu/') and name.endswith('.webp'))
              z.extractall('.')
          PY
          sha256sum --check photos.sha256
          rm photos.sha256
      - name: Commit photos and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/menu
          git rm .github/workflows/import-drive-photos.yml
          git commit -m "Use original drink photography"
          git push
