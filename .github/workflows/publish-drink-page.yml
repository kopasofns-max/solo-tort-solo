name: Publish drink page
on: push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify page
        run: |
          curl --fail --location --retry 2 -H "Referer: https://qu.ax/wgSCb" -o /tmp/tort_solo.html https://qu.ax/x/wgSCb.txt
          echo "cab9e8f16c419a03a49d0a3296a2dfe5bbbfb9b707a9e0f27bb93620505cf9e4  /tmp/tort_solo.html" | sha256sum --check
          cp /tmp/tort_solo.html tort_solo.html
      - name: Commit page and remove publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tort_solo.html
          git rm .github/workflows/publish-drink-page.yml
          git commit -m "Publish original drink photos and card styling"
          git push
