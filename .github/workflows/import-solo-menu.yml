name: Import solo menu update

on:
  push:
    paths:
      - .github/workflows/import-solo-menu.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify page
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Referer: https://qu.ax/e4W1e' \
            https://qu.ax/x/e4W1e.txt -o /tmp/tort_solo.html
          echo '97b94967acdfe0c5b33c353184dfa485831b9f3fcc9d512080ffee55f7b1a9b2  /tmp/tort_solo.html' | sha256sum --check
          cp /tmp/tort_solo.html tort_solo.html

      - name: Download and unpack menu photos
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Referer: https://qu.ax/Pmg7D' \
            https://qu.ax/x/Pmg7D.zip -o /tmp/solo_menu_assets.zip
          echo 'b1af17a7280453013ceef7cfe7dfcced4909588bab754159bd3dde218ce8d5a6  /tmp/solo_menu_assets.zip' | sha256sum --check
          mkdir -p assets/menu
          unzip -o /tmp/solo_menu_assets.zip -d assets/menu

      - name: Commit page and photos, remove importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-solo-menu.yml
          git add tort_solo.html assets/menu
          git commit -m 'Update tort solo menu and import PDF photos'
          git push origin HEAD:main
