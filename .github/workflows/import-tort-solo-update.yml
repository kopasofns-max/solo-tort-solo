name: Import verified tort solo update

on:
  push:
    paths:
      - .github/workflows/import-tort-solo-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and commit the tested HTML
        env:
          EXPECTED_SHA256: 5ef048a6b21843f886b6a90fe65aafb815557c2a2db42ecf0b0eae79ea9d4e51
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 60 -e 'https://qu.ax/WCOye' 'https://qu.ax/WCOye.txt' -o /tmp/tort_solo.html
          echo "$EXPECTED_SHA256  /tmp/tort_solo.html" | sha256sum -c -
          cp /tmp/tort_solo.html tort_solo.html
          rm -f .github/workflows/import-tort-solo-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tort_solo.html
          git add -A .github/workflows/import-tort-solo-update.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update food menu and drink card presentation'
          git push origin main
