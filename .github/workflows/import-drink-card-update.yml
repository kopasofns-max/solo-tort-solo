name: Import normalized drink cards

on:
  push:
    paths:
      - .github/workflows/import-drink-card-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and commit normalized drink cards
        env:
          EXPECTED_SHA256: 234be421a9c9be2fc4780de518770beac8de986b2376061053fbef8b811205a7
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 -e 'https://qu.ax/H1ixa' 'https://qu.ax/H1ixa.zip' -o /tmp/solo-update.zip
          echo "$EXPECTED_SHA256  /tmp/solo-update.zip" | sha256sum -c -
          rm -rf /tmp/solo-update
          unzip -q /tmp/solo-update.zip -d /tmp/solo-update
          cp /tmp/solo-update/tort_solo.html tort_solo.html
          cp /tmp/solo-update/assets/menu/*.webp assets/menu/
          rm -f .github/workflows/import-drink-card-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tort_solo.html assets/menu
          git add -A .github/workflows/import-drink-card-update.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Normalize drink photos and refine card shadows'
          git push origin main
